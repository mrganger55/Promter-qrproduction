name: Build macOS DMG

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build macOS arm64 DMG (ad-hoc signed)
        run: npx electron-builder --mac dmg --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ""

      - name: Upload DMG + ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: QR-Prompter-mac-${{ github.run_number }}
          path: |
            dist-app/*.dmg
            dist-app/*.zip
          retention-days: 30
          if-no-files-found: error
